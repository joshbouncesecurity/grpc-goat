syntax = "proto3";

package lab008fileprocessor;

option go_package = "grpc-goat/combined/server/proto";

service FileProcessor {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
}

message ListFilesRequest {
  string directory = 1;
}

message ListFilesResponse {
  bool success = 1;
  string output = 2;
  string flag = 3;
}
